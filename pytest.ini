[pytest]
pythonpath = .
testpaths = tests/backend tests/integration tests/security tests/performance
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI Options: HTML report, coverage, and verbose output
addopts = 
    -v 
    --cov=backend 
    --cov-report=term-missing 
    --cov-report=html:reports/coverage-html
    --html=reports/pytest-report.html 
    --self-contained-html

# Environment variables for testing
env =
    FLASK_ENV=testing
    DATABASE_PATH=data/test_predictions.db
    MLFLOW_TRACKING_URI=sqlite:///test_mlflow.db

# Markers
markers =
    unit: Unit tests
    integration: Integration/API tests
    performance: Performance and benchmark tests
    security: Security vulnerability tests
    ml: Machine Learning validation tests
    e2e: End-to-end browser tests (require Playwright and live servers)
