# ============================================================
# docker-compose.yml — Production Orchestration
# Smart Factory Predictive Maintenance Platform
# ============================================================
#
# Usage:
#   cp .env.example .env          # configure secrets
#   docker-compose up --build -d  # build & start all services
#   docker-compose ps             # verify health
#   docker-compose logs -f        # follow all logs
#
# Service access:
#   Frontend Dashboard : http://localhost:80
#   Backend API        : http://localhost:5000
#   MLflow UI          : http://localhost:5001
# ============================================================

version: '3.9'

# ── Shared defaults ─────────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-restart-policy: &default-restart
  restart: unless-stopped

services:

  # ── 1. MLflow Tracking & Model Registry ───────────────────
  # Started first: backend depends on MLflow to log metrics.
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
      args:
        VERSION: ${APP_VERSION:-2.0.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
        INSTALL_CLOUD_DEPS: ${INSTALL_CLOUD_DEPS:-false}
    image: smart-factory-pdm-mlflow:${APP_VERSION:-2.0.0}
    container_name: pdm_mlflow
    <<: *default-restart
    env_file:
      - .env
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/data/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: 5001
    ports:
      - "${MLFLOW_PORT:-5001}:5001"
    volumes:
      - pdm_mlflow_db:/mlflow/data
      - pdm_mlruns:/mlflow/artifacts
    networks:
      - pdm_network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/health"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ── 2. Flask Backend API ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        VERSION: ${APP_VERSION:-2.0.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: smart-factory-pdm-backend:${APP_VERSION:-2.0.0}
    container_name: pdm_backend
    <<: *default-restart
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      FLASK_PORT: "5000"
      PYTHONPATH: /app
      # Backend connects to MLflow via internal Docker network hostname
      MLFLOW_TRACKING_URI: http://mlflow:5001
      DB_PATH: /app/data/predictions.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - pdm_data:/app/data
      - pdm_models:/app/models
      - pdm_reports:/app/reports
      - pdm_logs:/app/logs
    networks:
      - pdm_network
    depends_on:
      mlflow:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-c"
        - >
          curl -sf http://localhost:5000/health |
          python3 -c "import sys,json; d=json.load(sys.stdin);
          sys.exit(0 if d.get('data',{}).get('status')=='healthy' else 1)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ── 3. React Frontend & Nginx Reverse Proxy ────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VERSION: ${APP_VERSION:-2.0.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
        # Leave VITE_API_URL empty when using Nginx proxy (recommended)
        VITE_API_URL: ${VITE_API_URL:-}
    image: smart-factory-pdm-frontend:${APP_VERSION:-2.0.0}
    container_name: pdm_frontend
    <<: *default-restart
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - pdm_network
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# ── Named Volumes ─────────────────────────────────────────────
# All volumes are named so data persists across container restarts
# and rebuilds. Run `docker volume ls` to inspect them.
volumes:
  pdm_data:
    name: pdm_data
  pdm_models:
    name: pdm_models
  pdm_reports:
    name: pdm_reports
  pdm_logs:
    name: pdm_logs
  pdm_mlflow_db:
    name: pdm_mlflow_db
  pdm_mlruns:
    name: pdm_mlruns

# ── Networks ──────────────────────────────────────────────────
networks:
  pdm_network:
    name: pdm_network
    driver: bridge
