user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;            # Hide Nginx version from responses

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    # ── Upstream: Flask/Gunicorn Backend ─────────────────────
    upstream backend_api {
        server backend:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ─────────────────────────────────
        add_header X-Frame-Options            "SAMEORIGIN"                always;
        add_header X-XSS-Protection           "1; mode=block"             always;
        add_header X-Content-Type-Options     "nosniff"                   always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;

        # ── Content Security Policy ──────────────────────────
        # Allows: same-origin scripts/styles, inline styles (for React),
        # data: URIs for images (charts), and API calls to /api.
        # Tighten further by removing 'unsafe-inline' once styles are
        # extracted to external CSS files.
        add_header Content-Security-Policy
            "default-src 'self';
             script-src 'self' 'unsafe-inline';
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
             font-src 'self' https://fonts.gstatic.com data:;
             img-src 'self' data: blob:;
             connect-src 'self';
             frame-ancestors 'none';"
            always;

        # ── SPA Routing: Fallback to index.html ───────────────
        # All non-file requests served by React Router.
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ── Static Asset Caching (immutable hashed bundles) ──
        # Vite generates content-hashed filenames (e.g., main.a1b2c3.js)
        # so 1-year immutable caching is safe — files never change in place.
        location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|mp4|ogg|webm)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        # ── API Reverse Proxy ──────────────────────────────────
        # All /api/* requests proxied to the Flask/Gunicorn backend.
        location /api/ {
            proxy_pass         http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";    # Required for upstream keepalive
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;

            # Buffer responses to prevent slow clients from blocking workers
            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 4k;
        }

        # ── Backend Health Proxy (for Docker health checks) ───
        location /health {
            proxy_pass         http://backend_api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # ── Nginx Internal Health Check ───────────────────────
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Block Hidden Files ────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
